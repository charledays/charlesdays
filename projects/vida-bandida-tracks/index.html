@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=Space+Grotesk:wght@500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
:root{
  --bg:#000;--text:#f5f2ed;--text-muted:#c7cbd6;

  --surface-text:#211d19;
  --surface-text-muted:#5e574c;
--font-display:'Space Grotesk', sans-serif;}
html{background:var(--bg);}
html,body{color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;}

/* ===== nav — reused as-is from index.html / film.html ===== */
.proto-nav{position:fixed;top:0;left:0;right:0;z-index:50;height:52px;display:flex;justify-content:flex-end;align-items:center;padding:0 1.1rem;background:transparent;}
.proto-logo,.proto-menu a{text-shadow:0 1px 3px rgba(0,0,0,0.75),0 2px 10px rgba(0,0,0,0.55),0 5px 20px rgba(0,0,0,0.35);}
.proto-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(-50% + 6px));display:inline-flex;align-items:center;}
.proto-logo-img{filter:drop-shadow(0 1px 2px rgba(0,0,0,0.95)) drop-shadow(0 2px 5px rgba(0,0,0,0.6));}
.proto-logo-img{display:block;width:118px;height:auto;margin-top:-8px;}
@media (min-width:768px){.proto-logo-img{width:135px;margin-top:0;}}
.proto-menu{display:none;}
.proto-menu a{font-size:0.75rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--text);text-decoration:none;opacity:0.72;}
.proto-menu a:hover{opacity:1;}
.proto-menu a[aria-current="page"]{opacity:1;}
.proto-menu a:focus-visible,.proto-logo:focus-visible{outline:2px solid rgba(255,255,255,0.9);outline-offset:3px;}
@media (min-width:768px){.proto-menu{display:flex;gap:1.5rem;}}

/* ===== mobile nav — MENU/CLOSE overlay, mobile-only (<768px). Desktop
   nav (.proto-menu) is completely untouched; this is an independent
   addition that reuses the same nav bar for its own header (logo stays
   pinned top-left, this toggle occupies the same top-right slot the
   desktop menu uses, so only one of the two is ever visible/laid out
   at a given width). ===== */
.proto-menu-toggle{display:inline-block;background:none;border:none;padding:0;font-family:'DM Sans',sans-serif;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--text);opacity:0.72;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,0.55),0 2px 10px rgba(0,0,0,0.35);}
.proto-menu-toggle:hover{opacity:1;}
.proto-menu-toggle:focus-visible{outline:2px solid rgba(255,255,255,0.9);outline-offset:3px;opacity:1;}
@media (min-width:768px){.proto-menu-toggle{display:none;}}

.mobile-nav-overlay{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;align-items:center;opacity:0;visibility:hidden;transition:opacity .25s ease;}

/* ======================================================================
   OPENING FRAME PROTOTYPE — VIDABANDIDA TRACKS only. Independent file,
   same isolated-per-project pattern already established for HIGHEND,
   INTERNAZIONALE and NEW YORKER 85'. Everything above this comment is
   the untouched cinematic-strip system. Everything below is scoped to
   this file and only ever activates for the vida-bandida-tracks strip.

   FIRST PASS — STRUCTURAL ONLY, same as NEW YORKER 85'. Reused
   unchanged: FLIP continuity technique, two-movement timing, paper-
   over-black concept, bone surface color, fixed exit control + adaptive
   contrast + aura, inertia mechanism/constants, teardown, and the
   approved 55vw desktop paper width (present from the start, not
   retrofitted). The body sequence renders VIDABANDIDA TRACKS' real
   stories.js content (context, credits, all 6 supportingImages) in a
   plain, single-image-per-step composition — no creative pairing/rhythm
   designed yet. The Opening anchor uses INTERNAZIONALE's height-based
   sizing technique with a 9:16 aspect ratio, matching cover.jpg's own
   native ratio (900×1600) — the series' own "reels" format, per its
   stored context copy. */

.of-hero{
  position:fixed;z-index:150;
  object-fit:cover;pointer-events:none;
}
.of-hero.is-animating{
  transition:
    top .6s cubic-bezier(.22,1,.36,1),
    left .6s cubic-bezier(.22,1,.36,1),
    width .6s cubic-bezier(.22,1,.36,1),
    height .6s cubic-bezier(.22,1,.36,1),
    object-position .6s cubic-bezier(.22,1,.36,1);
}
.of-hero.is-settling{
  transition:
    top .6s cubic-bezier(.22,1,.36,1),
    left .6s cubic-bezier(.22,1,.36,1),
    width .6s cubic-bezier(.22,1,.36,1),
    height .6s cubic-bezier(.22,1,.36,1),
    object-position .6s cubic-bezier(.22,1,.36,1);
}

/* Movement 2's landing composition — same flex+aspect-ratio technique as
   INTERNAZIONALE/NEW YORKER 85' (JS only reads the anchor's live rect
   once). Always row: a 9:16 anchor is narrower than NEW YORKER's own
   3:4 anchor at the same height, so it fits a narrow viewport at least
   as comfortably. */
.of-frame{
  position:fixed;inset:0;z-index:152;
  display:flex;align-items:center;justify-content:space-between;
  gap:4vw;padding:0 6vw;
  transform:translateY(-2.4vh);
  opacity:0;pointer-events:none;
  transition:opacity .32s ease;
}
.of-frame.is-visible{opacity:1;}

.of-frame-text{max-width:min(26vw,380px);}
.of-frame-role{font-size:0.68rem;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-muted);margin-bottom:1rem;text-shadow:0 1px 6px rgba(0,0,0,0.5);}
.of-frame-title{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(1.8rem,3.9vw,3.5rem);line-height:0.98;letter-spacing:-0.01em;color:var(--text);text-shadow:0 2px 16px rgba(0,0,0,0.45);}
.of-frame-year{margin-top:0.7rem;font-size:0.78rem;letter-spacing:0.18em;color:var(--text-muted);text-shadow:0 1px 6px rgba(0,0,0,0.5);}

/* Invisible layout marker only — the real .of-hero <img> is animated to
   match this box's rendered rect. aspect-ratio 9/16 matches cover.jpg's
   own native ratio, so object-fit:cover shows the complete frame with
   no cropped edges once the hero settles here. */
.of-anchor{height:clamp(300px,58vh,600px);aspect-ratio:9/16;flex:0 0 auto;}

@media (prefers-reduced-motion:reduce){
  .of-frame{transition:opacity .01s linear;}
}

.of-scroll{
  position:fixed;inset:0;z-index:155;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  overflow-anchor:none;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.of-scroll.is-active{opacity:1;pointer-events:auto;}

.of-spacer{height:calc(100svh - 34px);position:relative;}
@media (min-width:900px){
  /* Scroll-affordance test (VIDABANDIDA TRACKS only): the REAL bone
     paper's own top edge rising into view IS the cue — no arrow/label/
     line/icon of any kind. Shortening the spacer (the element that
     pushes .of-sequence, the actual paper, below the fold) reveals
     ~210px of it at the bottom of the resting opening frame, before any
     scroll input. .of-frame/.of-frame-title are position:fixed,
     independent of this scroll layer, so the title/year position is
     unaffected either way. */
  .of-spacer{height:calc(100svh - 210px);}
}

/* The PAPER — same approved concept as HIGHEND/INTERNAZIONALE/NEW YORKER
   85': narrower than the viewport, centered, so the darker Art Direction
   backdrop stays visible at both sides. Approved 55vw desktop width is
   present here from the start, not retrofitted afterward. */
.of-sequence{width:min(92vw,1440px);margin:0 auto;background:var(--surface-bg);}
@media (min-width:1200px){
  .of-sequence{width:55vw;}
}

/* Entrance slide (VIDABANDIDA TRACKS, desktop only): the paper itself
   starts ~120px below its approved resting position and animates up
   into it once, right as the project opens — the sheet feels like it
   slides up over the ART DIRECTION page, rather than simply appearing
   already raised. Only ever toggled on desktop widths (see the JS
   trigger in openVidabandida) — mobile/tablet never receive these
   classes, so .of-sequence there is never transformed. Final position
   is unchanged: with neither class present (before entering, and again
   after cleanup once settled), .of-sequence has no transform at all —
   identical to the currently approved resting position. */
#of-sequence.is-entering{transform:translateY(120px);}
#of-sequence.is-settling{transform:translateY(0);transition:transform 1s cubic-bezier(.22,.61,.36,1);}

.seq-img{display:block;width:100%;height:auto;}

/* STEP 1 — detail-01, opening image. Plain single-image beat, first
   pass only — no creative pairing/rhythm decided yet. */
.vb-image{max-width:900px;margin:0 auto;padding:1.2rem 1.4rem 2rem;}
.vb-image .seq-img{max-width:480px;margin:0 auto;}
@media (min-width:900px){
  .vb-image{padding:1.5rem 2.4rem 2.5rem;}
  .vb-image .seq-img{max-width:560px;}
}

/* STEP 2 — brief project story (role + canonical context), standalone,
   same pattern already used for HIGHEND/NEW YORKER 85's story beat. */
.vb-story{max-width:620px;margin:0 auto;padding:2.5rem 1.4rem;}
.vb-story-body{font-size:0.98rem;line-height:1.7;color:var(--surface-text);white-space:pre-line;font-weight:300;}
@media (min-width:900px){
  .vb-story{padding:3rem 2.4rem;}
  .vb-story-body{font-size:1.03rem;}
}

/* STEP 3 — credits + detail-02, one composed spread (relocated here
   from detail-04 so CAMERA/Fabrizio Díaz sits beside the photo where
   he is visibly filming) — same structural pattern as the other three
   projects' credit spreads, built with a percentage gap and min-width:0
   from the start (no viewport-relative gap introduced, so no later
   55vw containment fix is needed here). */
.vb-detail{
  max-width:1200px;margin:0 auto;padding:1.5rem 1.4rem;
  display:flex;flex-direction:column;gap:1.75rem;
}
.vb-detail-credits{max-width:320px;}
.vb-credit{margin-bottom:1rem;}
.vb-credit:last-child{margin-bottom:0;}
.vb-credit-role{display:block;font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--surface-text-muted);margin-bottom:0.3rem;}
.vb-credit-name{display:block;font-size:0.92rem;color:var(--surface-text);font-weight:300;}
.vb-detail .seq-img{max-width:420px;margin:0 auto 0 0;}
@media (min-width:900px){
  .vb-detail{padding:2.5rem 2.4rem;flex-direction:row-reverse;align-items:center;gap:4%;}
  .vb-detail-credits{flex:0 0 auto;}
  .vb-detail .seq-img{max-width:560px;margin:0;min-width:0;}
}

/* EPILOGUE — after detail-06. VIDABANDIDA TRACKS' externalLinks is
   currently empty ([] — DJ Sheiler set URL not yet confirmed, per
   stories.js), so no CTA is rendered — buildEpilogue() below already
   handles this conditionally (same function shape as HIGHEND/NEW YORKER
   85', nothing invented). Only the deliberate end-of-project Return
   renders here for now. */
.vb-epilogue{max-width:640px;margin:0 auto;padding:2rem 1.4rem 6rem;}
.vb-epilogue-kicker{font-size:0.66rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--surface-text-muted);margin-bottom:1rem;}
.vb-epilogue-link{display:inline-block;margin-bottom:3rem;font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--surface-text-muted);text-decoration:none;}
.vb-epilogue-link:hover{color:var(--surface-text);}
.vb-epilogue-return{
  display:inline-block;font-family:'DM Sans',sans-serif;
  font-size:0.9rem;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--surface-text);text-decoration:none;
  padding:13px 2px;
}
.vb-epilogue-return:hover{opacity:0.65;}
@media (min-width:900px){
  .vb-epilogue{padding:2.5rem 2.4rem 7rem;}
}

/* Fixed exit — identical rules to the HIGHEND/INTERNAZIONALE/NEW YORKER
   85'-approved control (reused verbatim). ONLY TEXT: no background,
   gradient, shadow-halo, pseudo-element, or blur — only the approved
   subtle aura and the adaptive color swap. */
.of-exit{
  position:fixed;bottom:1.3rem;left:1.2rem;z-index:200;
  font-size:0.875rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--text);text-decoration:none;opacity:0;pointer-events:none;
  background:none;box-shadow:none;filter:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;outline:none;
  text-shadow:0 0 8px rgba(0,0,0,.4);
  transition:opacity .3s ease;
  padding:13px 14px;
  display:inline-block;
}
.of-exit::before,.of-exit::after{content:none;}
.of-exit.is-visible{opacity:.8;pointer-events:auto;}
.of-exit:hover,.of-exit:focus-visible{opacity:1;}
.of-exit.is-on-surface{color:var(--surface-text);}

@media (min-width:768px){
  .of-exit{bottom:1.6rem;left:2.4rem;}
}

/* Opening-only "continues below" cue (VIDABANDIDA TRACKS, desktop only,
   test only) — no text, no arrow, no icon: a single thin line. Belongs
   to #of-scroll's own scrollable content (a child of .of-spacer, NOT
   fixed/sticky), positioned absolutely against that spacer so it scrolls
   away with the opening state exactly like ordinary content the moment
   the user scrolls — it can never sit fixed over the editorial paper or
   photographs below. Appears once the paper entrance animation settles
   (or immediately under reduced motion, which also disables the
   breathing keyframe below), makes a very small, slow, bounce-free
   vertical drift, then is explicitly faded out and disabled by JS as
   soon as real scroll input begins (see the scroll handler in
   openVidabandida). */
.of-continue-cue{
  /* Extended into a long, thin editorial spine per instruction (~7cm
     reference length). Capped at 140px rather than a literal ~264px
     (7cm @ 96dpi): the opening frame only has ~168px of genuinely empty
     space between the year text (bottom ~522px) and the paper's own
     top edge (~690px) at a typical 1440×900 desktop viewport — going
     longer would run the line straight through the title/year text,
     which stays a hard requirement. 140px uses nearly all of that
     empty space while leaving a clear ~14px gap below the year. */
  position:absolute;left:50%;bottom:14px;
  width:1px;height:140px;
  background:rgba(245,242,237,0.28);
  transform:translateX(-50%);
  opacity:0;pointer-events:none;
  transition:opacity .4s ease;
}
.of-continue-cue.is-visible{opacity:1;}
.of-continue-cue.is-breathing{animation:of-continue-drift 2.6s ease-in-out infinite;}
@keyframes of-continue-drift{
  0%,100%{transform:translateX(-50%) translateY(0);}
  50%{transform:translateX(-50%) translateY(6px);}
}
@media (prefers-reduced-motion:reduce){
  .of-continue-cue{transition:opacity .01s linear;}
  .of-continue-cue.is-breathing{animation:none;}
}
</style>

<script>
(function () {
  var toggle = document.getElementById('mobileMenuToggle');
  var overlay = document.getElementById('mobileNavOverlay');
  if (!toggle || !overlay) return;
  var isOpen = false;

  function openMenu() {
    isOpen = true;
    overlay.classList.add('is-open');
    overlay.removeAttribute('aria-hidden');
    toggle.textContent = 'CLOSE';
    toggle.setAttribute('aria-expanded', 'true');
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
    var firstLink = overlay.querySelector('a');
    if (firstLink) firstLink.focus();
  }

  function closeMenu() {
    isOpen = false;
    overlay.classList.remove('is-open');
    overlay.setAttribute('aria-hidden', 'true');
    toggle.textContent = 'MENU';
    toggle.setAttribute('aria-expanded', 'false');
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
    toggle.focus();
  }

  toggle.addEventListener('click', function () {
    if (isOpen) { closeMenu(); } else { openMenu(); }
  });

  document.addEventListener('keydown', function (e) {
    if (isOpen && e.key === 'Escape') { closeMenu(); }
  });
})();
</script>

<script type="module">
/* Standalone visual prototype (Opening Frame pass) for VIDABANDIDA
   TRACKS. Reads the real entry directly from stories.js. Does not
   modify art-direction-cinematic-strips-prototype.html, internazionale-
   opening-frame-prototype.html, highend-night-car-meet-opening-frame-
   prototype.html or new-yorker-85-opening-frame-prototype.html — this
   file embeds its own copy of the strip list (same pattern already
   established by the other three prototypes), so it can be evaluated
   independently. Only the click behavior for the vida-bandida-tracks
   strip differs; every other strip keeps today's no-op preventDefault. */
import { stories } from '/stories.js';

var byId = {};
stories.forEach(function (s) { byId[s.id] = s; });

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ======================================================================
   VISUAL SEQUENCE — VIDABANDIDA TRACKS only, FIRST PASS. Built from the
   real supportingImages array in stories.js, matched by filename
   fragment. Canonical `context`, `role`, and `credits` are used verbatim
   (HTML-escaped only), never rewritten. Presentation order below
   follows supportingImages' own stored order exactly (01→06) — no
   creative rhythm/pairing has been designed yet; that is deliberately
   deferred to a follow-up pass, per instruction.
   ====================================================================== */
function findSupportingImage(story, fragment) {
  return story.supportingImages.filter(function (img) {
    return img.src.indexOf(fragment) !== -1;
  })[0];
}

function seqImg(image) {
  return '<img class="seq-img" src="' + image.src + '" alt="' + esc(image.alt || '') + '" loading="lazy" decoding="async">';
}

/* Same grouping approach approved for the other three projects' credits:
   group by identical role, first-appearance order, presentation-only
   pluralization (role + "s" when a group has more than one name).
   Charles' own role is not added as a credit row — stories.js has no
   credits entry for him here either, so none is invented; his role is
   surfaced via story.role instead (see of-frame-role and the story-step
   kicker). */
function vbCredits(story) {
  var order = [];
  var byRole = {};
  story.credits.forEach(function (c) {
    if (!byRole[c.role]) { byRole[c.role] = []; order.push(c.role); }
    byRole[c.role].push(c.name);
  });
  return '<div class="vb-detail-credits">' +
    order.map(function (role) {
      var names = byRole[role];
      var label = names.length > 1 ? role + 's' : role;
      return '<p class="vb-credit">' +
        '<span class="vb-credit-role">' + esc(label) + '</span>' +
        names.map(function (n) { return '<span class="vb-credit-name">' + esc(n) + '</span>'; }).join('') +
      '</p>';
    }).join('') +
    /* LOCATION row — same .vb-credit markup/typography as CAMERA above,
       sourced from story.location (already stored in stories.js). Not
       part of story.credits itself (location is its own field in the
       content model), so it's appended here rather than folded into
       the credits-grouping loop above — same approach already used for
       NEW YORKER 85'. */
    (story.location ?
      '<p class="vb-credit">' +
        '<span class="vb-credit-role">Location</span>' +
        '<span class="vb-credit-name">' + esc(story.location) + '</span>' +
      '</p>'
      : '') +
  '</div>';
}

function buildVidabandidaSequence(story) {
  var img01 = findSupportingImage(story, 'detail-01');
  var img02 = findSupportingImage(story, 'detail-02');
  var img03 = findSupportingImage(story, 'detail-03');
  var img04 = findSupportingImage(story, 'detail-04');
  var img05 = findSupportingImage(story, 'detail-05');
  var img06 = findSupportingImage(story, 'detail-06');
  var role = Array.isArray(story.role) ? story.role.join(', ') : '';

  return '' +
    /* STEP 1 — detail-01, opening image. */
    '<section class="seq vb-image">' + seqImg(img01) + '</section>' +

    /* STEP 2 — brief project story, standalone. */
    '<section class="seq vb-story">' +
      '<p class="seq-kicker">' + esc(role) + '</p>' +
      '<p class="vb-story-body">' + esc(story.context || '') + '</p>' +
    '</section>' +

    /* STEP 3 — detail-02 + credits spread. Fabrizio Díaz (CAMERA) is the
       person visibly filming/recording in this photo, so the credit
       block sits beside this image, not detail-04 (image order/sequence
       is unchanged — only which step carries the credit column moved). */
    '<section class="seq vb-detail">' + vbCredits(story) + seqImg(img02) + '</section>' +

    /* STEP 4 — detail-03. */
    '<section class="seq vb-image">' + seqImg(img03) + '</section>' +

    /* STEP 5 — detail-04, plain image (no longer paired with credits). */
    '<section class="seq vb-image">' + seqImg(img04) + '</section>' +

    /* STEP 6 — detail-05. */
    '<section class="seq vb-image">' + seqImg(img05) + '</section>' +

    /* STEP 7 — detail-06. */
    '<section class="seq vb-image">' + seqImg(img06) + '</section>' +

    buildEpilogue(story);
}

function buildEpilogue(story) {
  var reelLink = story.externalLinks && story.externalLinks[0];
  // Internal route to where VIDABANDIDA TRACKS actually lives (Film) —
  // 'film.html' is the real, working relative link (no per-entry Film
  // deep-link route exists yet); same fallback already used by
  // Internazionale's own internal "VIEW IN FILM" CTA.
  var filmDestination = '/film/';

  return '<section class="seq vb-epilogue">' +
    (reelLink ?
      '<div>' +
        '<p class="vb-epilogue-kicker">Related</p>' +
        '<a href="' + reelLink.url + '" target="_blank" rel="noopener noreferrer" class="vb-epilogue-link">' + esc(reelLink.label) + '</a>' +
      '</div>'
      : '') +
    '<div>' +
      '<p class="vb-epilogue-kicker">Related</p>' +
      '<a href="' + filmDestination + '" class="vb-epilogue-link">VER EN FILM</a>' +
    '</div>' +
    /* Real navigation back to the main ART DIRECTION page — this is
       the end-of-project exit, distinct from the persistent #of-exit
       control used mid-sequence (which still closes/resets in place). */
    '<a href="/art-direction/" class="vb-epilogue-return" id="of-exit-end">&larr; RETURN TO ART DIRECTION</a>' +
  '</section>';
}

document.getElementById('of-sequence').innerHTML = buildVidabandidaSequence(byId['vida-bandida-tracks']);
openVidabandida(byId['vida-bandida-tracks']);

/* ======================================================================
   OPENING FRAME — VIDABANDIDA TRACKS only. Same FLIP-continuity
   technique and two-movement timing already approved for the other
   three projects (reused unchanged). IMMERSIVE_CROP is a TEMPORARY
   placeholder object-position for the momentary full-viewport beat —
   flagged here for real art direction review, exactly like the other
   projects' own placeholder crops were. */
var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var IMMERSIVE_CROP = '50% 34%'; // TEMPORARY — placeholder for art direction review

var BEAT_MS = 130;    // full-frame pause between the two movements
var SETTLE_MS = 600;  // Movement 2 duration — matches .of-hero.is-settling
var TEXT_LEAD_MS = Math.round(SETTLE_MS * 2 / 3);
var PAPER_ENTER_MS = 1000; // matches #of-sequence.is-settling's transition-duration below

/* Paper entrance slide — VIDABANDIDA TRACKS desktop only (see the
   #of-sequence.is-entering/.is-settling rules). Runs once, right as
   the paper fades in: starts 120px below the approved resting
   position, animates up into it, then both classes are cleared so
   .of-sequence is left with no transform at all — identical to the
   resting position before this animation existed, and with no residual
   effect on scroll/inertia (which operates on #of-scroll's real
   scrollTop, not on this transform). Skipped entirely below the 900px
   desktop breakpoint used for the raised resting position itself — the
   only visible state on mobile/tablet is the same permanently-untouched
   34px reveal, no animation. */
function animatePaperEntrance() {
  if (window.innerWidth < 900) return;
  var paperEl = document.getElementById('of-sequence');
  paperEl.classList.add('is-entering');
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      paperEl.classList.add('is-settling');
      paperEl.classList.remove('is-entering');
    });
  });
  setTimeout(function () {
    paperEl.classList.remove('is-settling');
    showContinueCue();
  }, PAPER_ENTER_MS);
}

/* Opening-only "continues below" cue — VIDABANDIDA TRACKS desktop only,
   test only (see .of-continue-cue rules). Fades in once the paper
   entrance settles, then breathes a few px down and back. It belongs
   only to the opening state: as soon as real scroll input arrives (see
   the scroll listener attached alongside this in openVidabandida), it
   is faded out and disabled for the rest of that open session — it does
   not reappear while scrolling through the project. Because the cue's
   own position is absolute against .of-spacer (not fixed/sticky), it
   also physically scrolls away with the opening state the instant the
   user scrolls, so it can never sit over the editorial paper or
   photographs below even during the brief fade-out. Under reduced
   motion the `.is-breathing` class is added but the keyframe itself is
   disabled via the prefers-reduced-motion rule, so it simply fades in
   and holds still until scrolled. */
function showContinueCue() {
  if (window.innerWidth < 900) return;
  var cueEl = document.getElementById('of-continue-cue');
  cueEl.classList.add('is-visible');
  cueEl.classList.add('is-breathing');
}

function hideContinueCue() {
  var cueEl = document.getElementById('of-continue-cue');
  cueEl.classList.remove('is-visible', 'is-breathing');
}

function openVidabandida(story) {
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  document.getElementById('of-scroll').scrollTop = 0;

  var hero = document.createElement('img');
  hero.className = 'of-hero';
  hero.src = story.cover.src;
  hero.alt = '';
  hero.setAttribute('aria-hidden', 'true');
  document.body.appendChild(hero);

  var frameEl = document.getElementById('of-frame');
  var anchorEl = document.getElementById('of-anchor');
  var scrollEl = document.getElementById('of-scroll');
  var exitEl = document.getElementById('of-exit');

  document.getElementById('of-frame-title').textContent = story.title || '';
  document.getElementById('of-frame-year').textContent = story.year ? String(story.year) : '';
  document.getElementById('of-frame-role').textContent = Array.isArray(story.role) ? story.role.join(', ') : '';

  function settleImmersive() {
    hero.style.top = '0px';
    hero.style.left = '0px';
    hero.style.width = window.innerWidth + 'px';
    hero.style.height = window.innerHeight + 'px';
    hero.style.objectPosition = IMMERSIVE_CROP;
  }

  function settleToArtwork() {
    var r = anchorEl.getBoundingClientRect();
    hero.style.top = r.top + 'px';
    hero.style.left = r.left + 'px';
    hero.style.width = r.width + 'px';
    hero.style.height = r.height + 'px';
    hero.style.objectPosition = '50% 50%';
  }

  if (reduceMotion) {
    settleToArtwork();
    scrollEl.classList.add('is-active');
    frameEl.classList.add('is-visible');
    exitEl.classList.add('is-visible');
    showContinueCue();
    return;
  }

  settleImmersive();

  setTimeout(function () {
    hero.classList.add('is-settling');
    settleToArtwork();

    setTimeout(function () {
      scrollEl.classList.add('is-active');
      frameEl.classList.add('is-visible');
      exitEl.classList.add('is-visible');
      animatePaperEntrance();
    }, TEXT_LEAD_MS);
  }, BEAT_MS);

  if (scrollEl._exitContrastHandler) {
    scrollEl.removeEventListener('scroll', scrollEl._exitContrastHandler);
  }
  scrollEl._exitContrastHandler = function () {
    var spacer = document.querySelector('.of-spacer');
    var pastSpacer = scrollEl.scrollTop >= spacer.offsetHeight - 8;
    var exitRect = exitEl.getBoundingClientRect();
    var paperRect = document.getElementById('of-sequence').getBoundingClientRect();
    var overPaper = exitRect.left >= paperRect.left && exitRect.right <= paperRect.right;
    exitEl.classList.toggle('is-on-surface', pastSpacer && overPaper);
  };
  scrollEl.addEventListener('scroll', scrollEl._exitContrastHandler);
  scrollEl._exitContrastHandler();

  /* Opening-only cue: the moment real scroll input arrives, fade it out
     and stop it from ever reappearing for the rest of this open
     session — it must never be seen sliding over the paper/photographs
     mid-scroll. */
  if (scrollEl._cueHideHandler) {
    scrollEl.removeEventListener('scroll', scrollEl._cueHideHandler);
  }
  var cueDismissed = false;
  scrollEl._cueHideHandler = function () {
    if (cueDismissed) return;
    if (scrollEl.scrollTop > 4) {
      cueDismissed = true;
      hideContinueCue();
      scrollEl.removeEventListener('scroll', scrollEl._cueHideHandler);
    }
  };
  scrollEl.addEventListener('scroll', scrollEl._cueHideHandler);
}


/* ======================================================================
   SCROLL INERTIA — identical mechanism/constants to the other three
   projects (reused unchanged), retargeted at this file's own
   #of-scroll. */
var reduceMotionForInertia = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var INERTIA_GAIN = 1.9;
var INERTIA_FRICTION = 0.92;
var INERTIA_STOP = 0.5;
var INERTIA_MAX = 140;

var inertiaVelocity = 0;
var inertiaRaf = null;

function isDesktopWidth() { return window.innerWidth >= 900; }

function stopInertia() {
  inertiaVelocity = 0;
  if (inertiaRaf !== null) { cancelAnimationFrame(inertiaRaf); inertiaRaf = null; }
}

function inertiaTick() {
  var scrollEl = document.getElementById('of-scroll');
  scrollEl.scrollTop += inertiaVelocity;
  inertiaVelocity *= INERTIA_FRICTION;
  if (Math.abs(inertiaVelocity) < INERTIA_STOP) {
    inertiaVelocity = 0;
    inertiaRaf = null;
    return;
  }
  inertiaRaf = requestAnimationFrame(inertiaTick);
}

if (!reduceMotionForInertia) {
  window.addEventListener('wheel', function (e) {
    var scrollEl = document.getElementById('of-scroll');
    if (!isDesktopWidth() || !scrollEl.classList.contains('is-active')) return;
    e.preventDefault();
    inertiaVelocity += e.deltaY * INERTIA_GAIN;
    if (inertiaVelocity > INERTIA_MAX) inertiaVelocity = INERTIA_MAX;
    if (inertiaVelocity < -INERTIA_MAX) inertiaVelocity = -INERTIA_MAX;
    if (inertiaRaf === null) { inertiaRaf = requestAnimationFrame(inertiaTick); }
  }, { passive: false });
}
</script>
</body>
</html>

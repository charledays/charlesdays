<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charles Days — Art Direction, Tattoo, Film & Visual Art</title>
<meta name="description" content="Multidisciplinary visual portfolio by Charles Days across art direction, tattoo, film and visual art.">
<link rel="canonical" href="https://charlesdays.art/">
<meta property="og:type" content="website">
<meta property="og:title" content="Charles Days — Art Direction, Tattoo, Film & Visual Art">
<meta property="og:description" content="Multidisciplinary visual portfolio by Charles Days across art direction, tattoo, film and visual art.">
<meta property="og:url" content="https://charlesdays.art/">
<meta property="og:image" content="https://charlesdays.art/images/manifiesto/gallery-wall.jpg">
<meta property="og:image:alt" content="Pared de la galería con obras y skates expuestos durante Manifiesto">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=Space+Grotesk:wght@500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
:root{
  --bg:#000;--ink:#1a2f6b;--ink-dark:#0f1d42;--muted:#2a4590;--border:#000;
  /* Real, loaded display typeface (Google Fonts, see @import above) —
     replaces the earlier 'Neue Machina' placeholder, which was never a
     real asset (no local file, no CDN, not on Google Fonts) and silently
     fell back to the browser's plain sans-serif. Space Grotesk was
     approved on /film/ first, then rolled out sitewide from here. */
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'DM Sans', sans-serif;
}
html{background:var(--bg);}
html,body{color:var(--ink);font-family:var(--font-body);overflow-x:hidden;touch-action:pan-y;}

/* Hidden until the loop's initial scroll position is set (see script at the
   end of body) — prevents the load→middle-copy jump from ever being visible.
   visibility:hidden (not display:none) so layout/offsetTop still compute. */
body{visibility:hidden;}
body.wall-ready{visibility:visible;}

/* ===== minimal nav — fixed, transparent, floats over the Wall =====
   No background/blur/border: legibility comes from text-shadow only, so
   imagery visibly continues underneath the nav at all times. Reused as-is
   from film.html / wall-final-test.html so Home stays part of the same
   visual system rather than introducing a new header. */
.proto-nav{position:fixed;top:0;left:0;right:0;z-index:50;height:52px;display:flex;justify-content:flex-end;align-items:center;padding:0 1.1rem;background:transparent;}
.proto-logo,.proto-menu a{text-shadow:0 1px 3px rgba(0,0,0,0.75),0 2px 10px rgba(0,0,0,0.55),0 5px 20px rgba(0,0,0,0.35);}
.proto-logo-img{filter:drop-shadow(0 1px 2px rgba(0,0,0,0.95)) drop-shadow(0 2px 5px rgba(0,0,0,0.6));}
/* Home only: the wordmark is no longer part of the nav's flex flow — it's
   fixed dead-center in the viewport, above the Wall, and non-interactive
   (the Wall underneath must stay fully scrollable/clickable; going "home"
   from the homepage is a no-op anyway). z-index 40 keeps it below the nav
   (50) but above the Wall's own tiles (unlayered). */
.proto-logo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;pointer-events:none;display:inline-flex;align-items:center;}
/* Home only: .proto-nav (z-index:50) sits above the mobile overlay
   (z-index:45), and the centered wordmark lives inside .proto-nav — so
   it showed through the open overlay regardless of its own inner
   z-index:40. Fix: hide the wordmark itself while the overlay is open.
   Targets #mobileNavOverlay.is-open directly — the overlay's own real
   open-state class, already toggled by the existing script below — via
   :has(), rather than a second, separately-maintained flag that could
   drift out of sync with it. */
body:has(#mobileNavOverlay.is-open) .proto-logo{display:none;}
.proto-logo-img{display:block;width:125px;height:auto;}
@media (min-width:768px){.proto-logo-img{width:230px;}}
.proto-menu{display:none;}
.proto-menu a{font-size:0.75rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#f5f2ed;text-decoration:none;}
.proto-menu a:hover{color:#fff;}
.proto-menu a:focus-visible,.proto-logo:focus-visible{outline:2px solid rgba(255,255,255,0.9);outline-offset:3px;}
@media (min-width:768px){.proto-menu{display:flex;gap:1.5rem;}}

/* ===== mobile nav — MENU/CLOSE overlay, mobile-only (<768px). Desktop
   nav (.proto-menu) is completely untouched; this is an independent
   addition that reuses the same nav bar for its own header (logo stays
   pinned top-left, this toggle occupies the same top-right slot the
   desktop menu uses, so only one of the two is ever visible/laid out
   at a given width). ===== */
/* Home-only bug: this page's :root never defines --text (only --ink/
   --ink-dark/--muted, meant for editorial pages' light background —
   see below). color:var(--text) was therefore invalid at compute time,
   which for an inherited property like `color` falls back to the
   inherited value — html,body's color:var(--ink), a dark navy meant for
   light backgrounds, over the Wall's dark imagery. That, not opacity
   alone, is why MENU nearly disappeared. Fixed with an explicit light
   color (same #f5f2ed used by the mobile nav overlay's own links below);
   size/weight/opacity raised further so it reads immediately as
   navigation rather than metadata. Padding grows the tap target without
   shifting the visible text off the nav's existing right-edge inset
   (negative margin cancels the padding's own offset). */
.proto-menu-toggle{display:inline-block;background:none;border:none;padding:0.5rem 0.2rem;margin:-0.5rem -0.2rem;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#f5f2ed;opacity:1;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,0.8),0 2px 10px rgba(0,0,0,0.6),0 5px 20px rgba(0,0,0,0.4);}
.proto-menu-toggle:hover{opacity:1;}
.proto-menu-toggle:focus-visible{outline:2px solid rgba(255,255,255,0.9);outline-offset:3px;opacity:1;}
@media (min-width:768px){.proto-menu-toggle{display:none;}}

.mobile-nav-overlay{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;align-items:center;opacity:0;visibility:hidden;transition:opacity .25s ease;}
.mobile-nav-overlay.is-open{opacity:1;visibility:visible;}
.mobile-nav-links{display:flex;flex-direction:column;gap:1.4rem;padding:0 1.6rem;width:100%;}
.mobile-nav-links a{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,10vw,2.6rem);letter-spacing:0.03em;color:#f5f2ed;text-decoration:none;opacity:0.85;}
.mobile-nav-links a:hover,.mobile-nav-links a:focus-visible{opacity:1;}
.mobile-nav-links a[aria-current="page"]{opacity:1;text-decoration:underline;text-underline-offset:0.3em;}
.mobile-nav-links a:focus-visible{outline:2px solid rgba(255,255,255,0.9);outline-offset:4px;}
@media (min-width:768px){.mobile-nav-overlay{display:none;}}
@media (prefers-reduced-motion:reduce){.mobile-nav-overlay{transition:none;}}


/* ===== Seamless loop — three stacked copies of the same composition =====
   Fixed at load, never grows. Only #copyMid is real; #copyTop/#copyBottom
   are visual + navigational clones (see accessibility notes in the report). */
.wall-loop{display:flex;flex-direction:column;gap:2px;}

/* Global Wall darkening wash — a single fixed, viewport-covering layer,
   not per-tile. Sits above the Wall imagery (z-index above the Wall's own
   unlayered tiles) but below the nav (z-index:50) and the Home wordmark
   (z-index:40). pointer-events:none so it never intercepts clicks/scroll —
   the Wall underneath stays fully interactive, exactly as before. */
.wall-darken{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,0.30);pointer-events:none;}

/* ===== The Wall — dense, art-directed vertical grid =====
   Begins at the true top of the viewport; the nav floats over it.
   Deterministic tile-size assignment (never randomized) so all three
   copies stay pixel-identical — required for the loop teleport to be invisible. */
.wall{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:44vw;grid-auto-flow:dense;gap:2px;background:var(--border);}
@media (min-width:768px){.wall{grid-template-columns:repeat(4,1fr);grid-auto-rows:180px;}}
/* The Wall's 17 curated items add up to 32 grid cells (t-small=1, t-wide/t-tall=2,
   t-large=4). 32 divides evenly by 2, 4 and 8 columns, so those column counts
   pack with zero empty cells — but NOT by 6: ceil(32/6)*6-32 leaves 4 cells that
   can never be filled by any arrangement of these tiles, which is what produced
   the large black voids reported at 1280/1440/1536px (this range previously used
   repeat(6,1fr)). Root cause was this column count, not a tile's row/column span
   or a height mismatch. Fix: this breakpoint now starts the same 8-column
   layout used at 1600px+ instead of an ill-fitting 6-column tier — same tile
   size classes, same row order, no filler, no image stretching (object-fit:cover
   is unchanged); it only changes how many columns the existing tiles flow into. */
@media (min-width:1200px){.wall{grid-template-columns:repeat(8,1fr);grid-auto-rows:200px;}}

/* "Wall breathes": --wall-scale is set once, at html.is-scrolling, and
   inherits down to every .tile for free — no per-tile listeners, nothing
   layout-affecting (transform only, never gap/width/height). */
.tile{position:relative;display:block;overflow:hidden;background:#000;transform:scale(var(--wall-scale,1));transition:transform .85s cubic-bezier(.22,1,.36,1);}
html.is-scrolling{--wall-scale:.93;}
/* Entering the active-scroll contraction stays quick/responsive; only the
   return-to-rest (the base .tile transition above) is slow and soft. */
html.is-scrolling .tile{transition:transform .28s ease-out;}
.tile img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-drag:none;}
a.tile{cursor:pointer;}
a.tile img{transition:transform .6s ease;}
a.tile::after{content:"";position:absolute;inset:0;background:rgba(15,29,66,0);transition:background .35s ease;}
a.tile:hover::after,a.tile:focus-visible::after{background:rgba(15,29,66,0.12);}
a.tile:hover img,a.tile:focus-visible img{transform:scale(1.035);}
a.tile:focus-visible{outline:2px solid var(--ink-dark);outline-offset:-2px;}

.t-small{grid-column:span 1;grid-row:span 1;}
.t-wide{grid-column:span 2;grid-row:span 1;}
.t-tall{grid-column:span 1;grid-row:span 2;}
.t-large{grid-column:span 2;grid-row:span 2;}

@media (prefers-reduced-motion: reduce){
  a.tile img{transition:none;}
  a.tile:hover img,a.tile:focus-visible img{transform:none;}
  .tile{transform:none !important;transition:none;}
}

/* ===== Editorial image viewer =====
   Not a generic lightbox: full-bleed black stage, object-fit:contain so the
   original aspect ratio is never cropped, quiet editorial metadata below
   rather than a card/panel. Hidden by default via display:none, shown only
   by adding .is-open (avoids fighting the native [hidden] attribute). */
.viewer{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column;}
.viewer.is-open{display:flex;}
.viewer-close{position:absolute;top:0.6rem;right:0.6rem;z-index:2;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#f5f2ed;font-size:1.7rem;line-height:1;cursor:pointer;}
.viewer-close:hover{color:#fff;}
.viewer-close:focus-visible{outline:2px solid rgba(255,255,255,0.9);outline-offset:2px;}
.viewer-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:3.5rem 1.5rem 1rem;}
.viewer-stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;}
.viewer-meta{flex:0 0 auto;text-align:center;padding:0.5rem 1.5rem 2rem;}
.viewer-discipline{font-size:0.6rem;letter-spacing:0.22em;text-transform:uppercase;color:#9aa4c2;margin-bottom:0.4rem;}
.viewer-title{font-family:var(--font-display);font-weight:700;font-size:1.4rem;letter-spacing:0.03em;color:#f5f2ed;margin-bottom:0.35rem;}
.viewer-title:empty,.viewer-role:empty{display:none;}
.viewer-role{font-size:0.65rem;letter-spacing:0.03em;color:#9aa4c2;margin-bottom:1rem;}
.viewer-cta{display:inline-block;font-size:0.62rem;letter-spacing:0.16em;text-transform:uppercase;color:#f5f2ed;text-decoration:none;border-bottom:1px solid rgba(245,242,237,0.4);padding-bottom:0.15rem;}
.viewer-cta:hover{border-color:#f5f2ed;}
.viewer-cta:focus-visible{outline:2px solid rgba(255,255,255,0.9);outline-offset:3px;}

@media (min-width:768px){
  .viewer-stage{padding:4.5rem 3rem 1.5rem;}
  .viewer-meta{padding:0.5rem 3rem 3rem;}
}

@media (prefers-reduced-motion: reduce){
  /* No motion is introduced by the viewer itself; nothing to disable here
     beyond what the existing Wall rule above already covers. */
}
</style>
</head>
<body>

<h1 class="sr-only">Charles Days — Art Direction, Tattoo, Film &amp; Visual Art</h1>

<nav class="proto-nav">
  <a class="proto-logo" href="/" aria-current="page"><img class="proto-logo-img" src="/images/brand/charlesdays-wordmark.png" alt="Charles Days"></a>
  <div class="proto-menu">
    <a href="/art-direction/">ART DIRECTION</a>
    <a href="/tattoo/">TATTOO</a>
    <a href="/film/">FILM</a>
    <a href="/about/">ABOUT</a>
  <a href="/manifiesto/">MANIFIESTO</a>
  </div>
  <button type="button" class="proto-menu-toggle" id="mobileMenuToggle" aria-expanded="false" aria-controls="mobileNavOverlay">MENU</button>
</nav>

<div class="mobile-nav-overlay" id="mobileNavOverlay" role="dialog" aria-modal="true" aria-label="Menú principal" aria-hidden="true">
  <nav class="mobile-nav-links" aria-label="Navegación móvil">
    <a href="/art-direction/">ART DIRECTION</a>
    <a href="/tattoo/">TATTOO</a>
    <a href="/film/">FILM</a>
    <a href="/about/">ABOUT</a>
    <a href="/manifiesto/">MANIFIESTO</a>
  </nav>
</div>

<script>
(function () {
  var toggle = document.getElementById('mobileMenuToggle');
  var overlay = document.getElementById('mobileNavOverlay');
  if (!toggle || !overlay) return;
  var isOpen = false;

  function openMenu() {
    isOpen = true;
    overlay.classList.add('is-open');
    overlay.removeAttribute('aria-hidden');
    toggle.textContent = 'CLOSE';
    toggle.setAttribute('aria-expanded', 'true');
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
    var firstLink = overlay.querySelector('a');
    if (firstLink) firstLink.focus();
  }

  function closeMenu() {
    isOpen = false;
    overlay.classList.remove('is-open');
    overlay.setAttribute('aria-hidden', 'true');
    toggle.textContent = 'MENU';
    toggle.setAttribute('aria-expanded', 'false');
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
    toggle.focus();
  }

  toggle.addEventListener('click', function () {
    if (isOpen) { closeMenu(); } else { openMenu(); }
  });

  document.addEventListener('keydown', function (e) {
    if (isOpen && e.key === 'Escape') { closeMenu(); }
  });
})();
</script>

<div class="wall-loop" id="wallLoop">

  <!-- Clone copy (loop only) — visually identical, fully clickable (same
       hrefs/metadata as the real copy), but excluded from keyboard/AT
       traversal via aria-hidden on the container + tabindex="-1" on each
       link (set by renderCopy below). Not inert: a visible clone must
       still be tappable/clickable. Tiles are rendered from stories.js —
       see the module script at the end of body. -->
  <div class="wall-copy" id="copyTop" aria-hidden="true">
    <main class="wall"></main>
  </div>

  <!-- Real copy — the only one exposed to assistive tech / keyboard. -->
  <div class="wall-copy" id="copyMid">
    <main class="wall" id="wallGrid"></main>
  </div>

  <!-- Clone copy (loop only) — same treatment as the top clone. -->
  <div class="wall-copy" id="copyBottom" aria-hidden="true">
    <main class="wall"></main>
  </div>

</div>

<div class="wall-darken" aria-hidden="true"></div>

<!-- Editorial image viewer — opens over the Wall on tile click.
     role="dialog"/aria-modal="true" + focus trap + Escape close. -->
<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Visor de imagen">
  <button type="button" class="viewer-close" id="viewerClose" aria-label="Cerrar">&times;</button>
  <div class="viewer-stage">
    <img id="viewerImg" src="" alt="">
  </div>
  <div class="viewer-meta">
    <p class="viewer-discipline" id="viewerDiscipline"></p>
    <p class="viewer-title" id="viewerTitle"></p>
    <p class="viewer-role" id="viewerRole"></p>
    <a class="viewer-cta" id="viewerCta" href="#"></a>
  </div>
</div>

<script type="module">
/* === Home = The Wall, driven by stories.js =============================
   Production migration of wall-final-test.html (the approved prototype):
   same loop/breathe/inertia/viewer systems, unchanged in behavior, now
   rendering real canonical entries instead of the prototype's generic
   wall-01..wall-14.jpg placeholders.

   Data source of truth: stories.js. Only entries explicitly curated for
   the Wall (`wall.include === true`) are rendered — that flag already
   exists in the schema for exactly this purpose, so no new field was
   needed to select Wall membership. Curation model: the Wall is built
   progressively from each finished section's strongest pieces, not from
   every story in the file — Film is the first finished section, so its
   11 selected entries are currently the entire Wall. Display order uses
   `wall.order` (an existing schema field) so the Wall can present an
   interleaved editorial sequence independent of Film's own series
   grouping (lost-frames/vidabandida/days-off) — that series grouping
   stays exactly as-is for film.html; `wall.order` has no effect there.
   Entries without a numeric `wall.order` fall back to their array
   position in `stories`, the same "array order = display order"
   convention already used for Film.

   Tile sizing reuses the exact size-class sequence from the approved
   prototype's 14-slot composition (t-tall/t-small/t-wide/t-large in the
   prototype's own order), applied positionally to however many real
   entries currently exist — this is not a new layout decision, it's the
   same rhythm the prototype already used, just not hand-authored per
   tile since the tile count is now data-driven. This is a first-stage
   composition, not a final one — it will be revisited once more sections
   are curated and added.

   Destination pages mostly don't exist yet (only /film — film.html — is
   built). `data-dest` still carries each entry's real intended route
   (nothing is invented or dropped), but the viewer's CTA link only
   renders when the destination is in BUILT_DESTINATIONS below — this is
   the one behavioral adjustment made for dynamic data integration, and
   it only prevents dead links; it does not change the Wall's visible
   composition, loop, breathe, or inertia behavior in any way. */
import { stories } from './stories.js';

var BUILT_DESTINATIONS = ['/film/', '/tattoo/', '/manifiesto/', '/art-direction/']; // pages that actually exist right now

/* Explicit per-position size sequence, one entry per Wall item (not cycled
   via idx % length — an earlier version of this array was shorter than the
   item count and wrapped, which silently aliased later items onto earlier
   ones' sizes and reintroduced dense-packing holes at the 6-/8-column
   desktop breakpoints; see git history if that bug resurfaces). Every time
   items are added, extend this array by the same number of entries — do
   not let it fall short again.

   Current 26-item sequence was hand-verified (dense-packing simulation at
   2/4/8 columns, the only column counts the CSS above still uses) to leave
   zero empty grid cells at every supported breakpoint: the total tile area
   this sequence produces (48 grid cells, same target as before — two items
   were removed but one remaining tile was bumped to t-large to keep the
   total unchanged) is evenly divisible by all of them. Sizes were chosen
   to roughly match each image's native aspect ratio (portrait photos as
   t-tall/t-small, landscape photos as t-wide) while hitting that area
   target — not randomized, not uniform. */
var WALL_TILE_SIZES = ['t-tall','t-small','t-small','t-wide','t-tall','t-small','t-large','t-large','t-tall','t-small','t-small','t-small','t-large','t-small','t-small','t-wide','t-tall','t-small','t-large','t-wide','t-small','t-wide','t-small','t-wide','t-small','t-wide'];

var wallItems = stories
  .filter(function (s) { return s.wall && s.wall.include; })
  .map(function (s, arrayIndex) { return { story: s, arrayIndex: arrayIndex }; })
  .sort(function (a, b) {
    var orderA = (a.story.wall.order == null) ? a.arrayIndex : a.story.wall.order;
    var orderB = (b.story.wall.order == null) ? b.arrayIndex : b.story.wall.order;
    return orderA - orderB;
  })
  .map(function (entry) { return entry.story; });

function escapeAttr(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

function tileMarkup(item, idx, isClone) {
  var size = WALL_TILE_SIZES[idx % WALL_TILE_SIZES.length];
  var dest = item.destinationUrl || '';
  var label = item.disciplineLabel || '';
  var title = item.title || '';
  var role = Array.isArray(item.role) ? item.role.join(', ') : '';
  // Wall-specific image override: use `wall.image` when a story sets one
  // (e.g. ALYH shows a different still on the Wall than on /film), else
  // fall back to the story's canonical `cover`. film.html never reads
  // `wall.image` — it only ever uses `cover`, so this has no effect there.
  var wallImage = item.wall && item.wall.image;
  var alt = (wallImage && wallImage.alt) || (item.cover && item.cover.alt) || '';
  var src = (wallImage && wallImage.src) || (item.cover && item.cover.src) || '';
  var tabindex = isClone ? ' tabindex="-1"' : '';
  var loading = (!isClone && idx === 0) ? 'eager' : 'lazy';

  return '<a class="tile ' + size + '" href="#" data-nav' + tabindex +
    ' data-dest="' + escapeAttr(dest) + '"' +
    ' data-discipline-label="' + escapeAttr(label) + '"' +
    ' data-title="' + escapeAttr(title) + '"' +
    ' data-role="' + escapeAttr(role) + '">' +
    '<img src="' + escapeAttr(src) + '" alt="' + escapeAttr(alt) + '" loading="' + loading + '" decoding="async">' +
    '</a>';
}

function renderCopy(containerId, isClone) {
  var grid = document.querySelector('#' + containerId + ' .wall');
  if (!grid) return;
  grid.innerHTML = wallItems.map(function (item, idx) { return tileMarkup(item, idx, isClone); }).join('');
}

renderCopy('copyTop', true);
renderCopy('copyMid', false);
renderCopy('copyBottom', true);

/* === Seamless vertical loop + "Wall breathes" — unified desktop/mobile ===
   Unchanged from wall-final-test.html. Native document scroll only: the
   browser owns scrolling throughout — we only ever reassign scrollY after
   the fact (never preventDefault, never a custom wheel/touch engine).
   Three stacked copies already exist in the DOM (#copyTop / #copyMid /
   #copyBottom), now populated above from stories.js instead of being
   hand-authored — fixed at load, nothing grows after that. */
(function () {
  var copyTop = document.getElementById('copyTop');
  var copyMid = document.getElementById('copyMid');
  var copyBottom = document.getElementById('copyBottom');

  function reveal() { document.body.classList.add('wall-ready'); }

  if (!copyTop || !copyMid || !copyBottom) { reveal(); return; }

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.documentElement;
  var H = 0;
  var scrollEndTimer = null;
  var resizeTimer = null;
  var SCROLL_END_DELAY = 60;
  var RESIZE_DEBOUNCE = 180;

  function measure() { H = copyMid.offsetTop - copyTop.offsetTop; }

  /* Loop teleport is deliberately deferred to scroll-END (see onScroll
     below) rather than run on every 'scroll' tick. Root cause of the
     mobile instability report: iOS Safari's native kinetic scrolling
     fires continuous 'scroll' events throughout its momentum phase, and
     calling window.scrollTo() WHILE that momentum is still running
     interrupts/resets it — perceived as the scroll randomly slowing or
     stopping mid-flick. All three copies are pixel-identical, so the
     teleport is invisible whenever it fires; deferring it until momentum
     has actually settled (same SCROLL_END_DELAY window already used for
     the breathe effect) avoids ever fighting the OS's own physics.
     Desktop's synthetic wheel-inertia (below) fires 'scroll' every rAF
     frame too, so this settles at the same natural point there as well —
     nothing about its own GAIN/FRICTION/velocity model changes. */
  function reposition() {
    if (H <= 0) return;
    var y = window.scrollY;
    if (y < H * 0.5) {
      window.scrollTo({ top: y + H, left: 0, behavior: 'auto' });
    } else if (y > H * 1.5) {
      window.scrollTo({ top: y - H, left: 0, behavior: 'auto' });
    }
  }

  function onScroll() {
    if (!reduceMotion) { root.classList.add('is-scrolling'); }
    if (scrollEndTimer) clearTimeout(scrollEndTimer);
    scrollEndTimer = setTimeout(function () {
      if (!reduceMotion) { root.classList.remove('is-scrolling'); }
      reposition();
    }, SCROLL_END_DELAY);
  }

  /* Viewport/layout can change the composition's height (breakpoint
     switch, font/image load settling). Re-measure on resize, but keep the
     visitor's logical position in the sequence (0 = top of the middle
     copy, 1 = bottom of it) rather than an absolute pixel offset, so a
     resize never throws them at an unrelated image. Debounced; no
     continuous observers. */
  function onResize() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (H <= 0) { measure(); return; }
      var frac = (window.scrollY - copyMid.offsetTop) / H;
      measure();
      if (H > 0) {
        window.scrollTo({ top: copyMid.offsetTop + frac * H, left: 0, behavior: 'auto' });
      }
    }, RESIZE_DEBOUNCE);
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onResize);

  measure();
  if (H > 0) { window.scrollTo(0, H); }
  reveal();
})();

/* === Desktop wheel synthetic inertia =====================================
   Unchanged from wall-final-test.html (the validation debug overlay that
   sat alongside this block in the prototype has been removed — it was
   explicitly marked in that file as "TEMPORARY DEBUG OVERLAY — validation
   build only... remove once the inertia feel is approved"; this is now
   production, so it's removed per that note, not redesigned). Real
   document scrolling only (window.scrollBy inside rAF) — the page itself
   is never transformed, so the seamless loop above needs no special
   handling. */
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  function isDesktop() { return window.innerWidth >= 768; }

  var GAIN = 1.9;
  var FRICTION = 0.92;
  var STOP_THRESHOLD = 0.5;
  var MAX_VELOCITY = 140;

  var velocity = 0;
  var rafId = null;
  var viewerOpen = false;

  function stop() {
    velocity = 0;
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  }

  function tick() {
    window.scrollBy(0, velocity);
    velocity *= FRICTION;
    if (Math.abs(velocity) < STOP_THRESHOLD) {
      velocity = 0;
      rafId = null;
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  function onWheel(e) {
    if (!isDesktop() || viewerOpen) return;
    e.preventDefault();
    velocity += e.deltaY * GAIN;
    if (velocity > MAX_VELOCITY) velocity = MAX_VELOCITY;
    if (velocity < -MAX_VELOCITY) velocity = -MAX_VELOCITY;
    if (rafId === null) { rafId = requestAnimationFrame(tick); }
  }

  window.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('wall:viewer-open', function () { viewerOpen = true; stop(); });
  window.addEventListener('wall:viewer-close', function () { viewerOpen = false; });
})();

/* === Editorial image viewer ===============================================
   Unchanged from wall-final-test.html except for one addition: the CTA
   only renders when its destination is in BUILT_DESTINATIONS (declared at
   the top of this script), so a tile whose real page doesn't exist yet
   (everything except /film, for now) opens the viewer to show the image
   and its known metadata, but offers no dead link forward. Loop, breathe,
   hover, and nav code are untouched. */
(function () {
  var viewer = document.getElementById('viewer');
  var stageImg = document.getElementById('viewerImg');
  var disciplineEl = document.getElementById('viewerDiscipline');
  var titleEl = document.getElementById('viewerTitle');
  var roleEl = document.getElementById('viewerRole');
  var ctaEl = document.getElementById('viewerCta');
  var closeBtn = document.getElementById('viewerClose');
  if (!viewer || !stageImg || !closeBtn) return;

  var savedScrollY = 0;
  var lastActiveTile = null;
  var isOpen = false;

  function ctaLabelFor(dest) {
    if (!dest) return null;
    if (dest.indexOf('/projects/') === 0) return 'VIEW PROJECT →';
    if (dest === '/art-direction/') return 'ART DIRECTION →';
    if (dest === '/tattoo/') return 'TATTOO →';
    if (dest === '/film/') return 'FILM →';
    if (dest === '/manifiesto/') return 'MANIFIESTO →';
    return null;
  }

  function isDestinationBuilt(dest) {
    return !!dest && BUILT_DESTINATIONS.indexOf(dest) !== -1;
  }

  function getFocusable() {
    return Array.prototype.slice.call(viewer.querySelectorAll('a[href], button:not([disabled])'));
  }

  function onKeydown(e) {
    if (e.key === 'Escape') { e.preventDefault(); closeViewer(); return; }
    if (e.key === 'Tab') {
      var f = getFocusable();
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault(); first.focus();
      }
    }
  }

  function openViewer(tile) {
    var img = tile.querySelector('img');
    if (!img) return;

    lastActiveTile = tile;
    stageImg.src = img.currentSrc || img.src;
    stageImg.alt = img.alt || '';

    disciplineEl.textContent = tile.getAttribute('data-discipline-label') || '';
    titleEl.textContent = tile.getAttribute('data-title') || '';
    roleEl.textContent = tile.getAttribute('data-role') || '';

    var dest = tile.getAttribute('data-dest') || '';
    var cta = isDestinationBuilt(dest) ? ctaLabelFor(dest) : null;
    if (cta) {
      ctaEl.textContent = cta;
      ctaEl.setAttribute('href', dest);
      ctaEl.style.display = '';
    } else {
      ctaEl.style.display = 'none';
    }

    /* Scroll lock that preserves exact position (fixed-body technique) —
       robust on iOS Safari, unlike plain overflow:hidden. */
    savedScrollY = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = (-savedScrollY) + 'px';
    document.body.style.width = '100%';

    window.dispatchEvent(new CustomEvent('wall:viewer-open'));

    viewer.classList.add('is-open');
    isOpen = true;
    document.addEventListener('keydown', onKeydown, true);
    closeBtn.focus();
  }

  function closeViewer() {
    if (!isOpen) return;
    isOpen = false;
    viewer.classList.remove('is-open');
    document.removeEventListener('keydown', onKeydown, true);

    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    window.scrollTo(0, savedScrollY);

    window.dispatchEvent(new CustomEvent('wall:viewer-close'));

    if (lastActiveTile) { lastActiveTile.focus(); }
    lastActiveTile = null;
  }

  closeBtn.addEventListener('click', closeViewer);

  document.querySelectorAll('a.tile[data-nav]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      openViewer(a);
    });
  });
})();
</script>
</body>
</html>
